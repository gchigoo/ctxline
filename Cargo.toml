[package]
name = "ctxline"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Compact Claude Code status-line context meter"
repository = "https://github.com/gchigoo/ctxline"

[dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
