name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Format check
        run: cargo fmt --check
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Native smoke
        run: python3 scripts/smoke.py target/release/ctxline
      - name: Check Windows target compilation
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo check --locked --target x86_64-pc-windows-gnu

  macos-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Format check
        run: cargo fmt --check
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Native smoke
        run: python3 scripts/smoke.py target/release/ctxline

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/smoke.py .\target\release\ctxline.exe
      - name: Windows native pipe smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $payload = '{"model":{"id":"deepseek-v4-pro[1m]"},"context_window":{"used_percentage":38.2,"total_input_tokens":380000,"total_output_tokens":2000,"context_window_size":1000000}}'
          $binary = (Resolve-Path .\target\release\ctxline.exe).Path
          $tmp = New-TemporaryFile
          [System.IO.File]::WriteAllText($tmp.FullName, $payload, [System.Text.UTF8Encoding]::new($false))
          try {
            $output = cmd.exe /d /s /c "type ""$($tmp.FullName)"" | ""$binary"""
            if ($LASTEXITCODE -ne 0) {
              throw "ctxline.exe exited with code $LASTEXITCODE"
            }
            if ($output -notmatch 'deepseek-v4-pro\[1m\].*382K/1\.0M') {
              throw "Unexpected native pipe output: $output"
            }
          } finally {
            Remove-Item -LiteralPath $tmp.FullName -Force -ErrorAction SilentlyContinue
          }
