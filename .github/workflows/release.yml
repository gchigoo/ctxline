name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig 0.16.0
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Verify source gates
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tags must look like vMAJOR.MINOR.PATCH"
            exit 1
          fi
          zig version
          zig fmt build.zig src/*.zig --check
          zig build test
      - name: Package release assets
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          package_target() {
            target="$1"
            name="$2"
            exe_suffix="$3"
            archive_kind="$4"

            rm -rf zig-out
            zig build -Dtarget="$target" -Doptimize=ReleaseFast

            stage="dist/$name"
            mkdir -p "$stage"
            cp "zig-out/bin/ctxline${exe_suffix}" "$stage/"
            cp LICENSE README.md "$stage/"

            if [ "$archive_kind" = "zip" ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              (cd dist && tar -czf "$name.tar.gz" "$name")
            fi
            rm -rf "$stage"
          }

          package_target x86_64-linux "ctxline-${VERSION}-linux-x86_64" "" tar
          python3 scripts/smoke.py zig-out/bin/ctxline
          package_target aarch64-linux "ctxline-${VERSION}-linux-aarch64" "" tar
          package_target x86_64-macos "ctxline-${VERSION}-macos-x86_64" "" tar
          package_target aarch64-macos "ctxline-${VERSION}-macos-aarch64" "" tar
          package_target x86_64-windows "ctxline-${VERSION}-windows-x86_64" ".exe" zip

          cd dist
          checksum() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$@"
            else
              shasum -a 256 "$@"
            fi
          }
          checksum *.tar.gz *.zip > SHA256SUMS
          for artifact in *.tar.gz *.zip; do
            checksum "$artifact" > "$artifact.sha256"
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "ctxline $GITHUB_REF_NAME" \
            --notes "ctxline $GITHUB_REF_NAME release assets. Verify downloads with SHA256SUMS or the per-asset .sha256 files." \
            --verify-tag