name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - name: Install cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Verify source gates
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tags must look like vMAJOR.MINOR.PATCH"
            exit 1
          fi
          cargo fmt --check
          cargo test --locked
      - name: Package Linux assets
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          package_target() {
            target="$1"
            name="$2"
            cargo build --release --locked --target "$target"
            stage="dist/$name"
            mkdir -p "$stage"
            cp "target/$target/release/ctxline" "$stage/"
            cp LICENSE README.md "$stage/"
            (cd dist && tar -czf "$name.tar.gz" "$name")
            rm -rf "$stage"
          }

          package_target x86_64-unknown-linux-gnu "ctxline-${VERSION}-linux-x86_64"
          python3 scripts/smoke.py target/x86_64-unknown-linux-gnu/release/ctxline
          package_target aarch64-unknown-linux-gnu "ctxline-${VERSION}-linux-aarch64"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Verify source gates
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tags must look like vMAJOR.MINOR.PATCH"
            exit 1
          fi
          cargo fmt --check
          cargo test --locked
      - name: Package macOS assets
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          package_target() {
            target="$1"
            name="$2"
            cargo build --release --locked --target "$target"
            stage="dist/$name"
            mkdir -p "$stage"
            cp "target/$target/release/ctxline" "$stage/"
            cp LICENSE README.md "$stage/"
            (cd dist && tar -czf "$name.tar.gz" "$name")
            rm -rf "$stage"
          }

          package_target x86_64-apple-darwin "ctxline-${VERSION}-macos-x86_64"
          package_target aarch64-apple-darwin "ctxline-${VERSION}-macos-aarch64"
          cargo build --release --locked
          python3 scripts/smoke.py target/release/ctxline
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Verify source gates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "release tags must look like vMAJOR.MINOR.PATCH"
          }
          cargo fmt --check
          cargo test --locked
      - name: Package Windows asset
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $name = "ctxline-$version-windows-x86_64"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          cargo build --release --locked --target x86_64-pc-windows-msvc
          python scripts/smoke.py .\target\x86_64-pc-windows-msvc\release\ctxline.exe
          $stage = Join-Path dist $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item .\target\x86_64-pc-windows-msvc\release\ctxline.exe $stage
          Copy-Item .\LICENSE $stage
          Copy-Item .\README.md $stage
          Compress-Archive -Path $stage -DestinationPath "dist\$name.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          for artifact in *.tar.gz *.zip; do
            sha256sum "$artifact" > "$artifact.sha256"
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "ctxline $GITHUB_REF_NAME" \
            --notes "ctxline $GITHUB_REF_NAME release assets. Verify downloads with SHA256SUMS or the per-asset .sha256 files." \
            --verify-tag
